name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false

      - name: Allow unprivileged user namespaces for the container tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
            develop -c ./build -j "$(nproc)" wirez

      - name: Test
        env:
          WIREZ_TEST_CONTAINER_REQUIRED: "1"
        run: |
          set -o pipefail
          nix --extra-experimental-features 'nix-command flakes' develop -c ./build -j "$(nproc)" test 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report failure
        if: failure()
        run: python3 dev/ci_report.py --log "$RUNNER_TEMP/build.log" --title "Build and test"

      - name: Test with the race detector
        env:
          WIREZ_TEST_CONTAINER_REQUIRED: "1"
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
            develop -c ./build -j "$(nproc)" -Drace test


  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false

      - name: Allow unprivileged user namespaces for the container tests
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Run the tests against the instrumented binary
        env:
          WIREZ_TEST_CONTAINER_REQUIRED: "1"
        run: |
          set -o pipefail
          nix --extra-experimental-features 'nix-command flakes' develop -c ./build -j "$(nproc)" -Dcoverage coverage 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report failure
        if: failure()
        run: python3 dev/ci_report.py --log "$RUNNER_TEMP/build.log" --title "Coverage"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: .build/coverage.out
          disable_search: true
          fail_ci_if_error: true
          flags: rootless
          verbose: true

  coverage-root:
    name: Coverage as root
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false

      - name: Let root read the checkout as a git repository
        run: sudo git config --global --add safe.directory "$PWD"

      # Real root takes wirez's privileged path: namespaces without a user
      # namespace, plain setuid for -uid/-gid. Tests needing sshd skip.
      - name: Run the tests as root against the instrumented binary
        env:
          WIREZ_TEST_CONTAINER_REQUIRED: "1"
        run: |
          set -o pipefail
          # sudoers' secure_path wins over --preserve-env=PATH, so nix by its full path
          sudo --preserve-env=PATH,WIREZ_TEST_CONTAINER_REQUIRED "$(command -v nix)" --extra-experimental-features 'nix-command flakes' develop -c ./build -B .build-root -j "$(nproc)" -Dcoverage coverage 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Report failure
        if: failure()
        run: python3 dev/ci_report.py --log "$RUNNER_TEMP/build.log" --title "Coverage as root"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: .build-root/coverage.out
          disable_search: true
          fail_ci_if_error: true
          flags: root
          verbose: true
